name: Kreol TTS samples

on:
  push:
    branches: [claude/project-thread-51hxjs]
    paths: [tools/tts_samples/make_samples.py, .github/workflows/tts-samples.yml]

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q libsndfile1
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers soundfile numpy
      - run: python tools/tts_samples/make_samples.py --out tools/tts_samples/out
      - name: Commit samples to this branch
        run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tools/tts_samples/out && git commit -m "Add MMS Kreol TTS samples" && git push
