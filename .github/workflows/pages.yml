name: Build and deploy web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARD: omniASR_CTC_300M_v2
  LARGE_CARD: omniASR_CTC_1B_v2

# Third-party actions are pinned to commits so a moved tag can't change what runs here.
jobs:
  # The 1B model is about 1 GB, and GitHub Pages caps a site at 1 GB, so it is published
  # to a Hugging Face model repo instead. Runs once the HF_REPO variable is set
  # (Settings > Secrets and variables > Actions); publishing also needs the HF_TOKEN secret.
  large:
    if: vars.HF_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore packed model
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/large-pack
          key: pack-${{ env.LARGE_CARD }}-${{ hashFiles('tools/export_onnx.py', 'tools/verify_onnx.py', 'tools/requirements-export.txt') }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install system audio library
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q libsndfile1

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install Python packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install -q -r tools/requirements-export.txt

      - name: Convert to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/export_onnx.py --card "$LARGE_CARD" --out build/large --check

      - name: Check against Meta's pipeline on Kreol speech
        if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/verify_onnx.py --card "$LARGE_CARD" --model-dir build/large --report build/large-report.json

      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/build_site.py pack --model-dir build/large --report build/large-report.json --out build/large-pack

      - name: Publish to Hugging Face
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}
        run: |
          pip install -q "huggingface_hub>=0.34,<1"
          python tools/publish_hf.py --dir build/large-pack --repo "$HF_REPO" --path "$LARGE_CARD"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: large-manifest
          path: build/large-pack/manifest.json

  build:
    needs: large
    # Build the site even if the 1B job is skipped or fails; the page then offers 300M only.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install system audio library
        run: sudo apt-get update -q && sudo apt-get install -y -q libsndfile1

      # fairseq2n refuses a CPU-only torch, so this pulls the default CUDA build (about 4 GB).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install Python packages
        run: pip install -q -r tools/requirements-export.txt

      - name: Restore converted model
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/model
          key: onnx-${{ env.CARD }}-${{ hashFiles('tools/export_onnx.py', 'tools/requirements-export.txt') }}

      - name: Convert to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/export_onnx.py --card "$CARD" --out build/model --check

      - name: Check against Meta's pipeline on Kreol speech
        run: python tools/verify_onnx.py --card "$CARD" --model-dir build/model --report build/report.json

      # Meta's MMS Kreol voice for "Read aloud". The check also runs its output through
      # the speech recogniser above, so a broken export can't sound like noise unnoticed.
      - name: Convert text-to-speech model and check it
        run: python tools/export_tts.py --out build/tts --asr-dir build/model --asr-report build/report.json

      - name: Check the page's tokenizer against Hugging Face's
        run: node tools/check_tts_tokenizer.mjs build/tts

      - name: Get the 1B manifest
        if: needs.large.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: large-manifest
          path: build/large-manifest

      - name: Assemble site
        env:
          HF_REPO: ${{ vars.HF_REPO }}
        run: |
          python tools/build_site.py pack --model-dir build/model --report build/report.json --out build/pack
          python tools/build_site.py pack-tts --model-dir build/tts --out build/tts-pack
          remote=()
          if [ -f build/large-manifest/manifest.json ]; then
            remote=(--remote "build/large-manifest/manifest.json=https://huggingface.co/$HF_REPO/resolve/main/$LARGE_CARD/")
          fi
          python tools/build_site.py site --local build/pack "${remote[@]}" --tts build/tts-pack --out site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
